<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cecile Yang Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mr+Dafoe&family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@400;500;600;800&display=swap">
<style>
/* Layout concept: a floating avatar stage as home, then a scroll-through of project chapters, then plain case-study pages.
   Look: one committed dark identity taken from the Assignment 2 deck (black, beige, deep red). */
:root{
  --ink:#070606;          /* page */
  --ink-2:#120f0e;        /* panels */
  --paper:#ddc8b6;        /* beige, main type */
  --paper-dim:#a89888;    /* secondary text */
  --red-fill:#a8121a;     /* buttons, fills */
  --red-ink:#e0343d;      /* red text on dark */
  --line:rgba(221,200,182,.2);
  --f-display:"Poppins","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-body:"Poppins","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-script:"Mr Dafoe","Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gap:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ink)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red-ink);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-top:10px;pointer-events:none}
.hdr{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:999px;background:rgba(18,15,14,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:5px 6px 5px 22px;min-height:48px}
.brand{white-space:nowrap;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:14px;text-decoration:none}
.brand::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--paper);box-shadow:0 0 0 3px var(--ink),0 0 0 4px var(--red-ink);margin-right:14px;vertical-align:-1px}
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;font-size:14px;font-weight:500;padding:8px 12px;border-radius:999px;color:var(--paper-dim)}
.nav a:hover{color:var(--paper)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--paper)}

/* shared */
.kicker{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim)}
.page-title{font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.9;letter-spacing:-.02em;font-size:clamp(52px,10vw,132px);margin:0;text-wrap:balance}
.script{font-family:var(--f-script);color:var(--red-ink);font-weight:400}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--red-fill);color:var(--paper);text-decoration:none;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;border:0;cursor:pointer}
.btn:hover{background:#c0161f}
.btn[disabled]{opacity:.45;cursor:not-allowed}
main{display:block;position:relative;z-index:1}
footer{position:relative;z-index:1}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.view{padding-block:40px 80px}
footer{border-top:1px solid var(--line);color:var(--paper-dim);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px}

/* placeholders */
.ph{position:relative;display:flex;align-items:flex-end;width:100%;height:100%;min-height:100%;background:
  repeating-linear-gradient(135deg,rgba(221,200,182,.07) 0 2px,transparent 2px 14px),var(--ink-2);
  border:1px dashed rgba(221,200,182,.35);color:var(--paper-dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:12px}
.ph b{color:var(--red-ink);font-weight:600;margin-right:8px}
.slot{position:relative;overflow:hidden;background:var(--ink-2)}
.slot img{display:block;width:100%;height:100%;object-fit:cover}
.slot.natural img{height:auto}
.slot img[style*="contain"]{background:var(--ink-2)}
.r-16-10{aspect-ratio:16/10}
.r-4-5{aspect-ratio:4/5}

/* home */
.stage{position:relative;min-height:clamp(560px,calc(100svh - 130px),800px);display:grid;place-items:center}
.center{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-block:28px 56px}
.orb{position:relative;width:clamp(190px,23vw,290px);aspect-ratio:1;margin-bottom:18px;animation:float 7s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--line);transition:inset .6s cubic-bezier(.2,.7,.2,1),border-color .6s}
.stage.on .orb::before{inset:-28px;border-color:var(--red-ink)}
.avatar{--rx:0deg;--ry:0deg;position:relative;aspect-ratio:1;display:block;width:100%;padding:0;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:var(--ink-2);cursor:pointer;transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry));transition:box-shadow .6s,transform .2s ease-out}
.stage.on .avatar{box-shadow:0 0 80px rgba(168,18,26,.4)}
.avatar img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 58%;filter:grayscale(1) contrast(1.05) brightness(.85);transition:filter .6s,transform .9s}
.stage.on .avatar img{filter:none;transform:scale(1.05)}
.avatar .ph{border:0;align-items:center;justify-content:center;text-align:center}
.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--red-ink);opacity:0;pointer-events:none;animation:pulse 4.5s ease-out infinite}
.stage.on .orb::after{animation:none;opacity:0}
.orb.still{animation:none;margin:0}
.orb.still::after{display:none}
.orb.still:hover::before{inset:-28px;border-color:var(--red-ink)}
.orb.still:hover .avatar{box-shadow:0 0 80px rgba(168,18,26,.4)}
.orb.still:hover .avatar img{filter:none;transform:scale(1.05)}
.avatar .slot{position:absolute;inset:0;height:100%;border-radius:50%}
.avatar .slot img{height:100%}
@keyframes pulse{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.32);opacity:0}}
.who{text-shadow:0 0 14px var(--ink),0 0 4px var(--ink);margin:0;font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.32em;text-transform:uppercase}
.role{text-shadow:0 0 16px var(--ink),0 0 5px var(--ink);margin:0;font-family:var(--f-script);font-size:clamp(30px,4.2vw,48px);line-height:1.1;color:var(--red-ink);opacity:.6;transition:opacity .5s,transform .5s}
.stage.on .role{opacity:1;transform:translateY(-2px)}
.enter{margin-top:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:11px 20px;background:rgba(18,15,14,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:border-color .3s,background .3s}
.enter:hover{border-color:var(--red-ink);background:var(--red-fill)}
.stage-foot{position:absolute;left:0;right:0;bottom:10px;z-index:1;margin:0;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim)}
@keyframes float{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}

/* work: scroll chapters */
.intro{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(28px,5vw,72px);align-items:center;padding-block:28px 48px}
.intro .orb{width:min(100%,clamp(200px,26vw,340px));margin-inline:auto}
.intro-name{font-size:clamp(44px,7vw,96px);margin-top:10px}
.intro-role{margin:10px 0 0;font-size:clamp(28px,3.4vw,44px);line-height:1.1}
.intro .statement{margin-top:24px}
.intro-looking{margin:20px 0 0;padding:14px 20px;border-left:3px solid var(--red-fill);background:var(--ink-2);max-width:36em}
.intro-looking .kicker{display:block;color:var(--red-ink);margin-bottom:6px}
.intro-tags{list-style:none;display:flex;gap:10px;flex-wrap:wrap;padding:0;margin:26px 0 0}
.intro-tags li{position:relative;font-family:var(--f-mono);font-size:clamp(13px,1.2vw,15px);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--paper);border:1px solid rgba(221,200,182,.55);border-radius:999px;padding:9px 18px 9px 30px;background:rgba(18,15,14,.6);transition:border-color .3s,box-shadow .3s}
.intro-tags li::before{content:"";position:absolute;left:14px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--red-ink);box-shadow:0 0 8px rgba(224,52,61,.7)}
.intro-tags li:hover{border-color:var(--red-ink);box-shadow:0 0 18px rgba(168,18,26,.35)}
.intro-short{margin:22px 0 0;font-size:clamp(16px,1.5vw,19px);line-height:1.55;color:var(--paper-dim);max-width:34em}
.intro-links{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 0}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--paper)}
.btn.alt:hover{border-color:var(--red-ink);background:rgba(168,18,26,.25)}
.work-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-top:40px;border-top:1px solid var(--line)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer;color:var(--paper-dim)}
.chip:hover{color:var(--paper);border-color:var(--paper-dim)}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.scroll-cue{display:flex;align-items:center;gap:14px;margin:28px 0 32px;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-dim)}
.scroll-cue i{position:relative;display:block;width:1px;height:56px;background:var(--line);overflow:hidden}
.scroll-cue i::after{content:"";position:absolute;left:-1px;top:-16px;width:3px;height:16px;border-radius:2px;background:var(--red-ink);animation:drip 2.4s ease-in-out infinite}
@keyframes drip{to{top:100%}}
.chap{--p:0;position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);align-items:center;min-height:min(62svh,560px);padding-block:36px;border-top:1px solid var(--line);opacity:0;transform:translateY(44px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.chap[hidden]{display:none}
.chap.in{opacity:1;transform:none}
.chap.flip{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.chap.flip .chap-media{order:-1}
.chap::before{content:attr(data-n);position:absolute;top:18px;right:0;z-index:0;font-weight:800;font-size:clamp(120px,19vw,260px);line-height:1;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px rgba(221,200,182,.09);pointer-events:none}
.chap.flip::before{right:auto;left:0}
.chap-text,.chap-media{position:relative;z-index:1}
.idx{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--red-ink);margin-bottom:20px}
.idx::after{content:"";display:inline-block;width:0;height:1px;background:var(--red-ink);vertical-align:middle;margin-left:14px;transition:width 1.1s .3s cubic-bezier(.2,.7,.2,1)}
.chap.in .idx::after{width:72px}
.chap-title{margin:0;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:.92;font-size:clamp(36px,5vw,72px);text-wrap:balance}
.chap-meta{margin:20px 0 0;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim)}
.chap-sum{margin:16px 0 0;max-width:32em}
.chap-cta{display:inline-flex;align-items:center;gap:10px;margin-top:30px;font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:11px 20px;background:rgba(18,15,14,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:border-color .3s,background .3s}
.chap:hover .chap-cta,.chap-cta:focus-visible{border-color:var(--red-ink);background:var(--red-fill)}
.chap-media{transform:translateY(calc(var(--p) * -34px));will-change:transform}
.chap-card{display:block;position:relative;overflow:hidden;background:var(--ink-2);aspect-ratio:16/10;box-shadow:0 30px 80px rgba(0,0,0,.55);transition:box-shadow .4s}
.chap.tall .chap-card{aspect-ratio:4/5;max-width:420px;margin-inline:auto}
.chap-card .slot{height:100%}
.chap-card .ph{align-items:flex-start}
.chap-card:hover{box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(224,52,61,.55),0 0 60px rgba(168,18,26,.25)}
.chap-card::before,.chap-card::after{content:"";position:absolute;width:16px;height:16px;z-index:2;pointer-events:none;transition:width .3s,height .3s,border-color .3s}
.chap-card::before{top:10px;left:10px;border-top:1px solid var(--paper);border-left:1px solid var(--paper)}
.chap-card::after{bottom:10px;right:10px;border-bottom:1px solid var(--paper);border-right:1px solid var(--paper)}
.chap-card:hover::before,.chap-card:hover::after{width:30px;height:30px;border-color:var(--red-ink)}
.rail{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column}
.rail::before{content:"";position:absolute;right:4px;top:15px;bottom:15px;width:1px;background:var(--line)}
.rail button{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:12px;height:30px;padding:0;border:0;background:none;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim)}
.rail button[hidden]{display:none}
.rail button span{opacity:0;transform:translateX(6px);transition:opacity .25s,transform .25s;white-space:nowrap;background:rgba(18,15,14,.85);padding:2px 10px;border-radius:999px}
.rail button:hover span,.rail button.on span,.rail button:focus-visible span{opacity:1;transform:none}
.rail button::after{content:"";width:9px;height:9px;border-radius:50%;border:1px solid var(--paper-dim);background:var(--ink);transition:background .3s,border-color .3s,box-shadow .3s}
.rail button.on::after{background:var(--red-ink);border-color:var(--red-ink);box-shadow:0 0 0 4px rgba(224,52,61,.2),0 0 14px rgba(224,52,61,.6)}
.work-view{padding-right:28px}
@media (max-width:1180px){.rail{display:none}.work-view{padding-right:0}}

/* case study */
.back{display:inline-block;text-decoration:none;font-size:14px;color:var(--paper-dim);margin-bottom:28px}
.back:hover{color:var(--paper)}
.case-title{font-size:clamp(48px,9vw,120px)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tag{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--paper-dim)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin:36px 0;padding-block:20px;border-block:1px solid var(--line)}
.facts dt{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim);margin:0 0 4px}
.facts dd{margin:0;font-size:15px}
.case-hero{margin-bottom:56px}
.sec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:32px;padding-block:32px;border-top:1px solid var(--line)}
.sec h2{margin:0;font-weight:800;text-transform:uppercase;font-size:clamp(22px,2.6vw,32px);letter-spacing:-.01em;line-height:1.05}
.sec .body{min-width:0;display:flex;flex-direction:column;gap:20px}
.sec p{margin:0;max-width:62ch}
.sec ul{margin:0;padding-left:1.1em;max-width:62ch}
.sec li{margin-bottom:6px}
.todo{border:1px dashed rgba(221,200,182,.35);padding:10px 14px;color:var(--paper-dim);font-size:14px;max-width:62ch}
.todo b{color:var(--red-ink);font-weight:600}
.statement+.todo{margin-top:18px}

/* before / after */
.ba{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--ink-2);--pos:50%}
.ba .layer{position:absolute;inset:0}
.ba .before{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.ba .lab{position:absolute;top:12px;padding:3px 10px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);z-index:2}
.ba .lab.l{left:12px}.ba .lab.r{right:12px}
.ba .handle{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;background:var(--red-ink);z-index:3;pointer-events:none}
.ba .handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--red-fill);border:2px solid var(--paper)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:4;margin:0}
.ba:focus-within{outline:2px solid var(--red-ink);outline-offset:3px}

/* audio */
.audio{display:flex;align-items:center;gap:16px;border:1px solid var(--line);padding:14px 16px;background:var(--ink-2)}
.audio .play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--red-fill);display:grid;place-items:center;cursor:pointer}
.audio .play[disabled]{opacity:.45;cursor:not-allowed}
.audio .play::before{content:"";border-left:14px solid var(--paper);border-block:8px solid transparent;margin-left:4px}
.wave{flex:1;display:flex;align-items:center;gap:3px;height:36px;min-width:0;overflow:hidden}
.wave i{flex:1;min-width:2px;background:var(--paper-dim);opacity:.6;border-radius:2px}
.audio small{color:var(--paper-dim);font-size:12px;white-space:nowrap}
.audio audio{width:100%}

/* process */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:36px}
.step{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-left:22px;border-left:1px solid rgba(224,52,61,.5)}
.step h3{margin:0;font-size:18px;font-weight:600}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:28px;margin-top:24px}
.next a{text-decoration:none;font-weight:800;text-transform:uppercase;font-size:clamp(20px,3vw,34px)}
.next a:hover{color:var(--red-ink)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:48px;align-items:start}
.about .portrait-s{position:sticky;top:96px}
.statement{font-size:clamp(18px,2vw,22px);line-height:1.55;max-width:34em;margin:20px 0 0}
.looking{margin-top:40px;padding:22px 24px;border-left:3px solid var(--red-fill);background:var(--ink-2)}
.looking h2{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-ink);font-weight:600}
.looking p{margin:0;font-size:18px;max-width:40em}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px;margin-top:44px}
.skills h3,.edu h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);font-weight:600}
.skills p{margin:0;font-size:15px}
.edu{margin-top:44px;display:grid;gap:16px}
.edu div{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.edu strong{font-weight:600}

/* contact */
.contact-list{margin:36px 0 0;display:grid;gap:0;max-width:720px}
.contact-list div{display:grid;grid-template-columns:minmax(80px,150px) minmax(0,1fr) auto;align-items:center;column-gap:16px;border-top:1px solid var(--line);padding-block:18px}
.contact-list dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim)}
.contact-list dd{margin:0;font-size:clamp(18px,2.4vw,26px);min-width:0;overflow-wrap:anywhere;user-select:all}
.contact-list dd.empty{color:var(--paper-dim);font-size:16px;user-select:auto}

/* tech layer */
.view,.stage{animation:enter .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}
[data-tilt]{will-change:transform;transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}
.btn,.chip,.enter,.nav a{transition:border-color .3s,background .3s,color .3s}
.chip:hover,.nav a:hover{border-color:var(--red-ink)}
.contact-list div{position:relative}

}

/* ---------- behaviour ---------- */
function bindWork(){
  const chaps=[...document.querySelectorAll('.chap')], rail=[...document.querySelectorAll('.rail button')];
  if(!chaps.length) return;
  function layout(){
    const vis=chaps.filter(c=>!c.hidden);
    vis.forEach((c,i)=>{ const n=String(i+1).padStart(2,'0'); c.dataset.n=n; c.classList.toggle('flip',i%2===1); c.querySelector('.idx').textContent=n+' / '+String(vis.length).padStart(2,'0'); });
    rail.forEach(b=>{ b.hidden=chaps.find(c=>c.dataset.slug===b.dataset.c).hidden; });
  }
  layout();
  document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    const f=b.dataset.f;
    document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', String(c===b)));
    chaps.forEach(c=>{ c.hidden = !(f==='All' || c.dataset.cats.split('|').includes(f)); });
    layout(); Scroll.tick();
  }));
  rail.forEach(b=>b.addEventListener('click',()=>{ const c=chaps.find(x=>x.dataset.slug===b.dataset.c); if(c) c.scrollIntoView({behavior:'smooth',block:'center'}); }));
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:.12});
    chaps.forEach(c=>io.observe(c));
  } else chaps.forEach(c=>c.classList.add('in'));
  Scroll.tick();
}
const Scroll = (() => {
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; let q=false;
  function tick(){
    const chaps=[...document.querySelectorAll('.chap:not([hidden])')]; if(!chaps.length) return;
    const vh=window.innerHeight; let best=null,bd=1e9;
    chaps.forEach(c=>{
      const r=c.getBoundingClientRect(), d=(r.top+r.height/2)-vh/2;
      if(!reduce) c.style.setProperty('--p',Math.max(-1,Math.min(1,d/vh)).toFixed(3));
      if(Math.abs(d)<bd){ bd=Math.abs(d); best=c; }
    });
    document.querySelectorAll('.rail button').forEach(b=>b.classList.toggle('on',!!best && b.dataset.c===best.dataset.slug && bd<vh*.5));
  }
  const on=()=>{ if(q) return; q=true; requestAnimationFrame(()=>{ q=false; tick(); }); };
  window.addEventListener('scroll',on,{passive:true}); window.addEventListener('resize',on);
  window.addEventListener('keydown',ev=>{
    if(ev.key!=='ArrowRight' && ev.key!=='ArrowLeft') return;
    if(ev.target.closest && ev.target.closest('input,textarea,video,audio,select')) return;
    const chaps=[...document.querySelectorAll('.chap:not([hidden])')]; if(!chaps.length) return;
    const mid=window.innerHeight/2; let cur=-1,bd=1e9;
    chaps.forEach((c,i)=>{ const r=c.getBoundingClientRect(), d=Math.abs((r.top+r.height/2)-mid); if(d<bd){bd=d;cur=i;} });
    const first=chaps[0].getBoundingClientRect();
    let nx = ev.key==='ArrowRight' ? cur+1 : cur-1;
    if(ev.key==='ArrowRight' && first.top>mid) nx=0;
    if(nx<0){ window.scrollTo({top:0,behavior:'smooth'}); ev.preventDefault(); return; }
    if(nx>=chaps.length) return;
    chaps[nx].scrollIntoView({behavior:'smooth',block:'center'}); ev.preventDefault();
  });
  return {tick};
})();
const Field = (() => {
  const cv=document.getElementById('field'), ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P='221,200,182', RD='224,52,61';
  let sy=0,sv=0,W=0,H=0,mx=null,my=null,eH=0,tH=0,mix=0,mixT=0,stage=null,orb=null,av=null,isOn=false,ptype='mouse',last=0,nodes=[];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const mk=()=>({fx:Math.random(),fy:Math.random(),vx:rnd(-1,1)*.000018,vy:rnd(-1,1)*.000018,a:rnd(0,6.283),d:rnd(1.25,2.6),sp:(Math.random()<.5?-1:1)*rnd(.00006,.00024),ph:rnd(0,6.283),s:rnd(1,2.4),par:rnd(.05,.2),hot:Math.random()<.18});
  function size(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    const want=W<700?22:40;
    while(nodes.length<want) nodes.push(mk());
    nodes.length=want;
    if(reduce) draw(performance.now(),16);
  }
  function draw(t,dt){
    ctx.clearRect(0,0,W,H);
    eH+=(tH-eH)*(reduce?1:.07); mix+=(mixT-mix)*(reduce?1:.06);
    let cx=0,cy=0,R=0;
    if(orb && mix>.01){ const o=orb.getBoundingClientRect(); cx=o.left+o.width/2; cy=o.top+o.height/2; R=o.width/2; }
    sv*=reduce?0:.9;
    const E=.12+(eH-.12)*mix+Math.min(.4,Math.abs(sv)/70)*(1-mix);      // overall energy, lifted while scrolling
    const C=.55+(eH-.55)*mix;      // cursor influence
    if(mix>.01){
      const prog=.22+.78*eH;
      [[1.16,1,.0003],[1.5,-1,.0002],[2.0,1,.00012]].forEach(([k,dir,sp],i)=>{
        ctx.beginPath(); ctx.lineWidth=1;
        ctx.strokeStyle=`rgba(${i===0?RD:P},${Math.max(.04,.14+.4*eH-i*.05)*mix})`;
        ctx.setLineDash(i===1?[3,9]:[]);
        const st=t*sp*dir*6+i; ctx.arc(cx,cy,R*k,st,st+6.283*prog); ctx.stroke();
      });
      ctx.setLineDash([]);
    }
    const pts=nodes.map(n=>{
      n.fx=(n.fx+n.vx*dt+1)%1; n.fy=(n.fy+n.vy*dt+1)%1;
      let x=n.fx*W, y=((n.fy*H-sy*n.par*(1-mix))%H+H)%H;
      if(mix>.01){ const rad=R*n.d*(1+.05*Math.sin(t*.0008+n.ph)), ang=n.a+t*n.sp; x+=(cx+Math.cos(ang)*rad*1.3-x)*mix; y+=(cy+Math.sin(ang)*rad*.8-y)*mix; }
      let near=0;
      if(mx!==null){ const dx=mx-x,dy=my-y,d=Math.hypot(dx,dy)||1; if(d<220){ near=1-d/220; const f=near*28*C; x+=dx/d*f; y+=dy/d*f; } }
      return {x,y,n,near};
    });
    const maxD=110+110*E;
    for(let i=0;i<pts.length;i++){
      const a=pts[i];
      for(let j=i+1;j<pts.length;j++){
        const b=pts[j], d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<maxD){ ctx.strokeStyle=`rgba(${P},${(1-d/maxD)*(.08+.45*E+(a.near+b.near)/2*.4*C)})`; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
      if(mx!==null && C>.05){ const d=Math.hypot(a.x-mx,a.y-my); if(d<200){ ctx.strokeStyle=`rgba(${RD},${(1-d/200)*.7*C})`; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mx,my); ctx.stroke(); } }
    }
    pts.forEach(p=>{ ctx.fillStyle=`rgba(${p.n.hot?RD:P},${Math.min(1,.28+.6*E+p.near*.5*C)})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.n.s*.75,0,6.283); ctx.fill(); });
  }
  function loop(t){ const dt=Math.min(50,t-last||16); last=t; draw(t,dt); requestAnimationFrame(loop); }
  function setOn(v){
    if(v===isOn) return; isOn=v; tH=v?1:0;
    if(stage) stage.classList.toggle('on',v);
    if(!v && av){ av.style.setProperty('--rx','0deg'); av.style.setProperty('--ry','0deg'); }
    if(reduce) draw(performance.now(),16);
  }
  function center(){ if(!orb) return null; const o=orb.getBoundingClientRect(); return {x:o.left+o.width/2,y:o.top+o.height/2,r:o.width/2}; }
  window.addEventListener('pointermove',ev=>{
    ptype=ev.pointerType; mx=ev.clientX; my=ev.clientY;
    const c=center();
    if(c){
      const d=Math.hypot(mx-c.x,my-c.y);
      if(ptype!=='touch'){ if(!isOn && d<c.r) setOn(true); else if(isOn && d>c.r*2.6) setOn(false); }
      if(isOn && av){ av.style.setProperty('--ry',(Math.max(-1,Math.min(1,(mx-c.x)/(c.r*2)))*7).toFixed(1)+'deg'); av.style.setProperty('--rx',(Math.max(-1,Math.min(1,(my-c.y)/(c.r*2)))*-7).toFixed(1)+'deg'); }
    }
    if(reduce) draw(performance.now(),16);
  });
  window.addEventListener('pointerdown',ev=>{ ptype=ev.pointerType; if(ptype==='touch'){ mx=ev.clientX; my=ev.clientY; } });
  window.addEventListener('pointerup',ev=>{ if(ev.pointerType==='touch'){ mx=my=null; } });
  document.documentElement.addEventListener('mouseleave',()=>{ mx=my=null; if(ptype!=='touch') setOn(false); });
  window.addEventListener('scroll',()=>{ const y=window.scrollY; sv+=(y-sy)*.35; sy=y; if(reduce) draw(performance.now(),16); },{passive:true});
  window.addEventListener('resize',size);
  size();
  if(!reduce) requestAnimationFrame(loop);
  return {
    attach(){
      stage=document.getElementById('stage'); orb=stage?stage.querySelector('.orb'):null; av=stage?stage.querySelector('.avatar'):null;
      isOn=false; tH=0; mixT=stage?1:0;
      if(av){
        av.addEventListener('click',()=>{ if(ptype==='touch') setOn(!isOn); });
        av.addEventListener('focus',()=>{ if(ptype!=='touch') setOn(true); });
        av.addEventListener('blur',()=>setOn(false));
      }
      if(reduce) draw(performance.now(),16);
    }
  };
})();
function bindTilt(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-tilt]').forEach(t=>{
    const amp=parseFloat(t.dataset.tilt)||4;
    t.addEventListener('pointermove',ev=>{ const r=t.getBoundingClientRect(); const x=(ev.clientX-r.left)/r.width-.5, y=(ev.clientY-r.top)/r.height-.5; t.style.setProperty('--ry',(x*amp).toFixed(2)+'deg'); t.style.setProperty('--rx',(-y*amp).toFixed(2)+'deg'); });
    t.addEventListener('pointerleave',()=>{ t.style.setProperty('--ry','0deg'); t.style.setProperty('--rx','0deg'); });
  });
}
function bindPhones(){
  const ph=document.getElementById('phones'); if(!ph) return;
  ph.addEventListener('pointermove',ev=>{ const r=ph.getBoundingClientRect(); ph.style.setProperty('--px',(((ev.clientX-r.left)/r.width-.5)*2).toFixed(2)); ph.style.setProperty('--py',(((ev.clientY-r.top)/r.height-.5)*2).toFixed(2)); });
  ph.addEventListener('pointerleave',()=>{ ph.style.setProperty('--px',0); ph.style.setProperty('--py',0); });
}
function bindCopy(){
  document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{
    const t=b.dataset.copy; let ok=false;
    try{ await navigator.clipboard.writeText(t); ok=true; }catch(e){
      try{ const r=document.createRange(); const dd=b.parentElement.querySelector('dd'); r.selectNodeContents(dd); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); ok=document.execCommand('copy'); }catch(_){}
    }
    const old=b.textContent; b.textContent=ok?'Copied':'Select and copy'; setTimeout(()=>{ b.textContent=old; },1600);
  }));
}
function bindBA(){
  const ba=document.getElementById('ba'); if(!ba) return;
  ba.querySelector('input').addEventListener('input',e=>ba.style.setProperty('--pos', e.target.value+'%'));
}
let first = true;
function route(){
  const h=(location.hash||'#home').slice(1);
  let html, nav=null;
  if(h==='home'){ html=home(); }
  else if(h==='work'){ html=work(); nav='work'; }
  else if(h==='about'){ html=about(); nav='about'; }
  else if(h==='contact'){ html=contact(); nav='contact'; }
  else if(h.startsWith('project-')){ html=project(h.slice(8)); nav='work'; }
  else { html=home(); }
  app.innerHTML = html;
  Field.attach();
  document.querySelectorAll('[data-nav]').forEach(a=>{ a.dataset.nav===nav ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'); });
  if(h==='work') bindWork();
  bindTilt();
  bindCopy();
  if(h==='project-margin') bindPhones();
  bindBA();
  window.scrollTo(0,0);
  if(!first){ const t=app.querySelector('h1'); if(t){ t.setAttribute('tabindex','-1'); t.focus({preventScroll:true}); } }
  first=false;
}
window.addEventListener('hashchange',route);
route();
</script>
